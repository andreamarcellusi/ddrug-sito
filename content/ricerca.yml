drug_delivery:
  temi:
  - titolo: Preparazioni oromucosali
    dettaglio: film orodispersibili, forme mucoadesive, liofilizzati orali
    persone: [Francesco Cilurzo, Paola Minghetti, Francesca Selmin, Umberto M. Musazzi, Chiara Meazzini]
  - titolo: Iniettabili a lunga durata d'azione e chemioembolizzazione
    persone: [Francesca Selmin, Francesco Cilurzo, Silvia Franzè]
  - titolo: Vettori non virali e nanocarrier bioispirati
    persone: [Silvia Franzè, Francesco Cilurzo, Giulia Anderluzzi, Marta Medeo, Viola Bertolotti, Teodora Dal Buono]
  - titolo: Nanocarrier per la somministrazione transdermica e transmucosale
    persone: [Francesco Cilurzo, Silvia Franzè, Umberto M. Musazzi, Antonella Casiraghi]
  - titolo: Sistemi transdermici
    persone: [Francesco Cilurzo, Paola Minghetti, Antonella Casiraghi, Chiara Gennari, Umberto M. Musazzi]
  - titolo: Cosmetici
    persone: [Antonella Casiraghi, Paola Minghetti]
regulatory:
  # Nella presentazione gli altri temi regolatori sono ancora segnaposto ("AAAAA"): da completare.
