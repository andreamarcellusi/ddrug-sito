presentazione:
- Si è laureata in Chimica e tecnologia farmaceutiche all'Università di Padova nel 2016, con una tesi svolta in collaborazione con la Aston University di Birmingham sull'uso della microfluidica per produrre nanoparticelle caricate con proteine. Nel 2019 ha conseguito il dottorato alla University of Strathclyde di Glasgow, in collaborazione con GlaxoSmithKline (Siena), studiando nanoparticelle cationiche come sistemi di rilascio per RNA autoamplificante.
- Dal 2020 è stata post-doc all'Università Vita-Salute San Raffaele, su nanoparticelle decorate con citochine ricombinanti per la terapia oncologica. Dal 2023 è all'Università degli Studi di Milano, dove sviluppa nuove piattaforme di rilascio per la terapia genica.
