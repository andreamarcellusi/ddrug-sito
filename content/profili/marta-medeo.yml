affiliazione: Dipartimento di Scienze Farmaceutiche, Università degli Studi di Milano
ambiti: [Vescicole lipidiche, Acidi nucleici, Somministrazione cutanea, Aspetti regolatori]
presentazione:
- Si è laureata in Chimica e tecnologia farmaceutiche all'Università degli Studi di Milano nel 2022, con una tesi sullo sviluppo di liposomi come adiuvanti per la veicolazione di antigeni proteici e sulla valutazione del loro potenziale immunogeno.
- Nel 2023 ha iniziato il dottorato in "RNA Therapeutics and Gene Therapy". La ricerca riguarda gli aspetti regolatori e di rilascio delle vescicole lipidiche sintetiche e biologiche per la somministrazione cutanea di acidi nucleici.
