presentazione:
- Dottoranda in Scienze farmaceutiche all'Università degli Studi di Milano. Si è laureata in Chimica e tecnologia farmaceutiche nel marzo 2023 con una tesi su idrogel nanocompositi biocompatibili per il rilascio prolungato di farmaci, svolta all'Istituto Mario Negri sotto la supervisione della Prof.ssa Luisa De Cola e del Dr. Jonathan Michael Zuidema.
- Il progetto di dottorato studia la fattibilità della liofilizzazione di terapie avanzate.
