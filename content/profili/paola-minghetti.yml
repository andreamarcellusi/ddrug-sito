presentazione:
- Professoressa ordinaria di Tecnologia e normativa farmaceutiche all'Università degli Studi di Milano. Dall'ottobre 2023 dirige il Dipartimento di Scienze Farmaceutiche; dal 2020 al 2023 è stata Preside della Facoltà di Farmacia. Insegna nella Scuola di specializzazione in Farmacia ospedaliera.
- La ricerca riguarda i sistemi di rilascio transdermici e buccali, l'elaborazione dottrinale della normativa nazionale ed europea su produzione e commercio di medicinali, dispositivi medici e prodotti per la salute, e le preparazioni magistrali nelle farmacie ospedaliere e di comunità.
