presentazione:
- Professore associato al Dipartimento di Scienze Farmaceutiche. Ha competenze nella progettazione e caratterizzazione di sistemi di rilascio dermici, transdermici, oromucosali e orodispersibili. Nel 2012 è stato visiting graduate student alla University of Missouri, Kansas City, dove ha studiato le criticità della somministrazione di farmaci alla coclea nel trattamento dei disturbi dell'orecchio interno.
- La ricerca integra lo sviluppo di formulazioni e processi produttivi innovativi con il quadro regolatorio dei prodotti per la salute, per razionalizzare la progettazione di medicinali, dispositivi medici, cosmetici e integratori e migliorare gli standard regolatori del loro controllo di qualità.
