affiliazione: Dipartimento di Scienze Farmaceutiche, Università degli Studi di Milano
ambiti: [Film orodispersibili, Stampa 3D, Liposomi, Rilascio prolungato]
presentazione:
- Si è laureata in Chimica e tecnologia farmaceutiche all'Università degli Studi di Milano nel 2022, con una tesi sullo sviluppo di un processo per ottenere liposomi liofilizzati preparati per iniezione di solvente.
- Nel dottorato in Scienze farmaceutiche ha lavorato alla progettazione e ottimizzazione di una stampante 3D per la preparazione estemporanea di film orodispersibili. Un periodo di ricerca all'Università di Granada è stato dedicato all'incapsulamento di farmaci in nanoargille da caricare nei film stampati, per ottenere un rilascio prolungato.
