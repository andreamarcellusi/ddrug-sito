affiliazione: Dipartimento di Scienze Farmaceutiche, Università degli Studi di Milano
ambiti: [Nanoparticelle lipidiche, Acidi nucleici, Editing genico, CRISPR, Nanomedicina]
presentazione:
- Ingegnera biomedica, si interessa di nanomedicina per il rilascio di farmaci e geni. Ha conseguito la laurea triennale alla Sapienza Università di Roma, con una tesi su una piattaforma lab-on-chip per la PCR in tempo reale, e la magistrale al Politecnico di Milano, con un periodo di ricerca al Diabetes Research Institute della University of Miami su nanoparticelle polimeriche per l'immunoterapia locale nel trapianto di cellule beta pancreatiche nel diabete di tipo 1.
- Nel 2025 ha iniziato il dottorato in Scienze farmaceutiche all'Università degli Studi di Milano. La ricerca riguarda la progettazione di nanoparticelle lipidiche per la veicolazione di acidi nucleici e per l'editing genico con tecnologia CRISPR.
