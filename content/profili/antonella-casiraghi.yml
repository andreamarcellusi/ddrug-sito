presentazione:
- Dal 2006 al Dipartimento di Scienze Farmaceutiche, dove è oggi professoressa associata. Fin dall'inizio si è occupata della fattibilità del rilascio transdermico di nuove molecole e di come aumentare la diffusione passiva di quelle già note, con il metodo delle celle di diffusione su membrane e formulazioni diverse.
- In seguito l'interesse si è esteso alla permeabilità di molecole vegetali a uso medicinale o cosmetico e agli studi di preformulazione e formulazione, prima di cerotti monostrato e poi di semisolidi. Una parte dell'attività mira a migliorare le preparazioni galeniche in farmacia, con studi su formulazioni adatte all'uso medico della Cannabis.
