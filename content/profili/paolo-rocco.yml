presentazione:
- Professore a contratto all'Università degli Studi di Milano, dove si è laureato in Chimica (1996) e in Farmacia (2007) e ha conseguito il dottorato in Chimica del farmaco (2015). Insegna nei corsi "Protein engineering, drug delivery and regulatory aspects" e "Regulatory aspects in toxicology".
- La ricerca riguarda soprattutto gli aspetti regolatori dei medicinali complessi (biotecnologici, medicinali per terapie avanzate e farmaci complessi non biologici) e dei dispositivi medici, in particolare le combinazioni farmaco-dispositivo e i dispositivi a base di sostanze.
