presentazione:
- Professoressa associata di Drug delivery e scienze regolatorie al Dipartimento di Scienze Farmaceutiche. Nel 2013 ha trascorso nove mesi come visiting scholar all'Institut Galien Paris-Sud (CNRS, Université Paris-Sud), lavorando su liposomi per il trattamento del tumore prostatico.
- Dopo il dottorato ha unito questa esperienza alla formazione sul rilascio transdermico, progettando liposomi deformabili in grado di veicolare attraverso la pelle farmaci poco permeabili e studiando come stabilizzarli. Il suo interesse principale resta la progettazione di nanocarrier lipidici per veicolare molecole terapeutiche, compresi gli acidi nucleici, attraverso le barriere biologiche.
- È responsabile di un progetto PRIN 2022 sulla progettazione di nanoparticelle simili a vescicole extracellulari per la terapia oncologica e partecipa a un progetto PNRR del Centro Nazionale 3, spoke 8. Fa parte del consiglio direttivo del Controlled Release Society Italy Chapter.
