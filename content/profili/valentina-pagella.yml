presentazione:
- Si è laureata in Scienze farmaceutiche all'Università degli Studi di Milano con una tesi sullo sviluppo di terapie digitali e di dispositivi medici digitali gestiti dal paziente. Oggi frequenta un dottorato industriale e intersettoriale per l'innovazione.
- La ricerca esplora approcci terapeutici basati su dispositivi medici digitali. Analizza il panorama europeo delle terapie digitali e i quadri regolatori e amministrativi di altri Paesi per proporre un sistema che faciliti l'ingresso di queste tecnologie in Italia.
