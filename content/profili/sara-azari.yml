ambiti: [Affari regolatori, Medicinali a base di RNA, Autorizzazione all'immissione in commercio, Variazioni post-marketing]
presentazione:
- Si è laureata in Medicina veterinaria alla Islamic Azad University (Iran) nel 2020, con una tesi di tossicologia e istopatologia. Dopo un breve periodo in un'azienda farmaceutica a Teheran, nel 2021 ha iniziato la laurea magistrale in Biotecnologie farmaceutiche all'Università degli Studi di Milano, concentrandosi sugli aspetti regolatori dei medicinali a base di RNA.
- La tesi magistrale, "Nucleic Acid-Based Medicinal Products. State of the Art and Regulatory Issues", ha esaminato le criticità del percorso di autorizzazione dei medicinali a RNA, analizzando i prodotti approvati o respinti da EMA e FDA e le variazioni post-marketing dei medicinali autorizzati.
