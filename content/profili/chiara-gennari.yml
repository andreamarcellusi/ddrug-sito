presentazione:
- Professoressa associata al Dipartimento di Scienze Farmaceutiche, dove insegna Tecnologia e legislazione farmaceutiche e Produzione dei medicinali biotecnologici.
- La ricerca riguarda lo studio e la progettazione di sistemi di rilascio bioadesivi, come cerotti transdermici e forme mucoadesive, e la valutazione della permeabilità cutanea e transmucosale di medicinali, cosmetici e dispositivi medici. Ha studiato anche il phage display come tecnica di screening in vitro per individuare peptidi capaci di attraversare le membrane biologiche.
- Ha coordinato due progetti finanziati dall'Ateneo, "Peptide-transferosome conjugate", nanocarrier transdermico per veicolare macromolecole attraverso la pelle (Piano di sviluppo 2014, linea B), e "Film forming formulations for topical delivery of drugs" (Piano di sostegno alla ricerca 2015-2017, linea 2).
