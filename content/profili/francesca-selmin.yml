presentazione:
- Professoressa associata di Drug delivery al Dipartimento di Scienze Farmaceutiche dal 2018 e, dal 2023, direttrice della Scuola di specializzazione in Farmacia ospedaliera. Dopo il dottorato è stata visiting scientist al College of Pharmacy della University of Kentucky, nel laboratorio del Dr. DeLuca, dove ha approfondito la progettazione e la caratterizzazione di sistemi di rilascio biodegradabili.
- Le sue competenze riguardano i sistemi parenterali complessi e i sistemi di rilascio oromucosali. Si occupa anche dello sviluppo di saggi non compendiali per caratterizzare i sistemi a rilascio controllato.
