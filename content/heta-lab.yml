risorse_intro: La ricerca deve tradursi in documenti consultabili, confronti pubblici e strumenti per nuove domande.
risorse:
- titolo: Working paper
  testo: Analisi preliminari e lavori in corso.
- titolo: Presentazioni e poster
  testo: Contributi a congressi e materiali scientifici.
- titolo: Workshop e seminari
  testo: Incontri su metodi e problemi aperti.
- titolo: Report di progetto
  testo: Deliverable, report tecnici e risultati applicati.
didattica_intro: La didattica serve a rendere leggibili metodi, evidenze e decisioni.
