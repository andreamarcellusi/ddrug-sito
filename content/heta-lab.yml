# Pagina HETA Lab. Contenuti ricavati dalla pagina del vecchio sito
# (ddrug.unimi.it/research/health-economics-and-technology-assessment-heta-lab/, ultima modifica 2 agosto 2026).
# I testi sono una riscrittura da approvare; le due citazioni sono riportate come sul vecchio sito.
# Esclusi per le regole del sito: Nina Di Gregorio (ruolo da indicare) e The Modelling Week (da decidere).
motto: Il valore di un'innovazione non è soltanto un numero. È una decisione da rendere trasparente.
missione: HETA Lab è il laboratorio di dDRUG per l'economia sanitaria e l'Health Technology Assessment. Studia come le evidenze cliniche, economiche e di real world possono sostenere decisioni più consapevoli su valore, prezzo, rimborso e accesso alle tecnologie sanitarie.
domande_intro: Le discipline definiscono il campo. Le domande spiegano perché studiarlo.
domande:
- titolo: Come misuriamo il valore di un'innovazione sanitaria?
  testo: Esiti clinici, costi, qualità della vita e impatto organizzativo, integrati in valutazioni utili alle decisioni.
- titolo: Come cambiano le valutazioni quando arrivano nuovi dati?
  testo: Ciclo di vita delle tecnologie, real-world evidence e processi di rivalutazione.
- titolo: Quali evidenze dovrebbero orientare prezzo, rimborso e accesso?
  testo: Il rapporto tra evidenze disponibili, comparatori, incertezza e processi decisionali.
- titolo: Come valutiamo sostenibilità ed equità senza confonderle?
  testo: Dimensioni tenute distinte, per capire chi beneficia di un'innovazione, a quale costo e con quali conseguenze per il sistema.
metodo_intro: Una valutazione parte dalla decisione che il modello deve aiutare a comprendere, non dal modello.
metodo:
- titolo: Definire la decisione
  testo: Popolazione, alternative, prospettiva e contesto d'uso.
- titolo: Rendere visibili dati e incertezza
  testo: Fonti, assunzioni, limiti, comparatori e variabili che guidano i risultati.
- titolo: Interpretare le conseguenze
  testo: Risultati tradotti in implicazioni comprensibili per pazienti, professionisti e decisori.
citazione: I modelli producono risultati. Le decisioni richiedono ancora qualcuno che li interpreti.
progetti:
- titolo: Valutazione economica dell'obesità e delle patologie metaboliche correlate in Italia
  stato: In corso · avviato il 16 marzo 2026
  domanda: Qual è il carico clinico ed economico dell'obesità in Italia e quale impatto potranno avere le tecnologie emergenti sul Servizio sanitario nazionale.
  metodi: Cost-of-illness, HTA, horizon scanning
  persone: [Andrea Marcellusi, Martina Managò]
  link: https://ddrug.unimi.it/valutazione-economica-dellobesita-e-delle-patologie-metaboliche-correlate-in-italia/
persone:
- nome: Andrea Marcellusi
  ruolo: Coordinamento scientifico
  temi: Economia sanitaria, HTA, accesso alle innovazioni e politiche farmaceutiche.
- nome: Giacomo De Santis
  ruolo: Post-doc in Market Access
