    interno: true
  - titolo: Scienze regolatorie e accesso al mercato di prodotti ad attività terapeutica e salutare
    dati: Master di II livello · A.A. 2025/2026
    testo: "Modulo Il market access di medicinali e dispositivi medici: 4 CFU, 40 ore."
    link: formazione.html#scienze-regolatorie-e-accesso-al-mercato-di-prodotti-ad-atti
    interno: true
- gruppo: Formazione istituzionale e per organizzazioni
  voci:
  - titolo: Approfondimenti metodologici sugli ITC nelle valutazioni comparative di tecnologie sanitarie
    dati: Corso istituzionale AIFA · 12 ore
    testo: "Tre incontri in presenza sulle evidenze comparative dirette e indirette, con lezioni interattive e casi applicativi: PICO, similarità e transitività, external control arm, MAIC, ML-NMR, network meta-analysis e qualità delle evidenze. Docenti: Carlotta Galeone e Andrea Marcellusi."
  - titolo: Aziende farmaceutiche e società di consulenza
    dati: Corsi e relazioni scientifiche
    testo: HTA, valutazioni economiche, evidenze comparative, real-world data e processi di prezzo, rimborso e accesso. L'attenzione è su qualità dei metodi, trasparenza delle assunzioni e corretta interpretazione delle implicazioni decisionali.
collaborazioni: Il laboratorio è interessato a collaborazioni scientifiche, progetti multidisciplinari, tesi e percorsi di ricerca su economia sanitaria, HTA e accesso alle innovazioni.
